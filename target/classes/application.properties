spring.application.name=gym-management-backend
server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://mysql-1b4737c1-abhiakella0-aeaf.k.aivencloud.com:27367/gymmanagement?ssl-mode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${avn_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always
